version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - noctx
    - nolintlint
    - revive
    - unparam
  settings:
    revive:
      rules:
        - name: unused-parameter
          disabled: true
formatters:
  enable:
    - gofmt
    - goimports
