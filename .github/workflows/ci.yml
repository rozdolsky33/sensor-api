name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go mod tidy is clean
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - name: vet
        run: go vet ./...
      - name: lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.1
      - name: test
        run: go test -race -count=1 -coverprofile=coverage.out -coverpkg=./internal/... ./...
      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -1
      - name: swagger is up to date
        run: go tool swag init -g cmd/server/main.go -o docs && git diff --exit-code -- docs/docs.go docs/swagger.json docs/swagger.yaml

  docker:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: sensor-api:ci
